<!DOCTYPE html>
<html lang="es"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario - InvPlus</title>
    <link rel="stylesheet" href="../css/decoracion.css">
</head>
<body>

<section class="form-register">

    <!-- Se agrega autocomplete="off" para evitar que el navegador rellene datos viejos -->
    <form action="https://invplus-backend.onrender.com/crear-usuario" method="POST" autocomplete="off">

        <h4>Formulario de registro</h4>

        <h5>Ingrese su fecha de nacimiento</h5>
        <input class="controls" type="date" name="fecha_nacimiento" required>

        <br><br>

        <h5>Ingrese su tipo de documento</h5>
        <select name="tipo_documento" required>
            <option value="">Seleccione un tipo de identificación</option>
            <option value="cc">Cédula de ciudadanía</option>
            <option value="ce">Cédula de extranjería</option>
            <option value="ti">Tarjeta de identidad</option>
            <option value="nit">Nit</option>
            <option value="pasaporte">Pasaporte</option>
        </select>

        <br><br>

        <input class="controls" type="number" name="identificacion" placeholder="Ingrese su número de identificación" required autocomplete="new-password">
        <input class="controls" type="text" name="nombres" placeholder="Ingrese su Nombre" required autocomplete="off">
        <input class="controls" type="text" name="apellidos" placeholder="Ingrese sus Apellidos" required autocomplete="off">
        <input class="controls" type="email" name="correo" placeholder="Ingrese su Correo" required autocomplete="off">
        
        <!-- Usamos "new-password" para indicar que es un campo de creación, no de inicio de sesión -->
        <input class="controls" type="password" name="password" placeholder="Ingrese su contraseña" required autocomplete="new-password">
        
        <br><br>

        <input class="button" type="submit" value="Registrar">

        <p style="text-align: center; margin-top: 10px;">
            <a href="iniciar_sesion.html" style="color: #1f53c5; font-size: 14px; text-decoration: none;">¿Ya tienes cuenta? Inicia sesión</a>
        </p>

    </form>

</section>

</body>
</html>
