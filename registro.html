<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario - InvPlus</title>
    <link rel="stylesheet" href="css/decoracion.css">
</head>
<body>

<section class="form-register">
    <form id="formulario-registro" onsubmit="enviarDatos(event)" autocomplete="off">

        <h4>Formulario de registro</h4>

        <h5>Ingrese su fecha de nacimiento</h5>
        <input class="controls" type="date" name="fecha_nacimiento" required>

        <br><br>

        <h5>Ingrese su tipo de documento</h5>
        <select name="tipo_documento" required>
            <option value="">Seleccione un tipo de identificación</option>
            <option value="cc">Cédula de ciudadanía</option>
            <option value="ce">Cédula de extranjería</option>
            <option value="ti">Tarjeta de identidad</option>
            <option value="nit">Nit</option>
            <option value="pasaporte">Pasaporte</option>
        </select>

        <br><br>

        <input class="controls" type="number" name="identificacion" placeholder="Ingrese su número de identificación" required>
        <input class="controls" type="text" name="nombres" placeholder="Ingrese su Nombre" required>
        <input class="controls" type="text" name="apellidos" placeholder="Ingrese sus Apellidos" required>
        <input class="controls" type="email" name="correo" placeholder="Ingrese su Correo" required>
        <input class="controls" type="password" name="password" placeholder="Ingrese su contraseña" required>
        
        <br><br>

        <input class="button" type="submit" value="Registrar">

        <p style="text-align: center; margin-top: 10px;">
            <a href="iniciar_sesion.html" style="color: #1f53c5; font-size: 14px; text-decoration: none;">¿Ya tienes cuenta? Inicia sesión aquí</a>
        </p>
    </form>
</section>

<script>
    function enviarDatos(event) {
        event.preventDefault(); // Evita que la página se recargue sola

        const form = event.target;
        const datos = {
            fecha_nacimiento: form.fecha_nacimiento.value,
            tipo_documento: form.tipo_documento.value,
            identificacion: form.identificacion.value,
            nombres: form.nombres.value,
            apellidos: form.apellidos.value,
            correo: form.correo.value,
            password: form.password.value
        };

        // Enviamos los datos al servidor en formato JSON
        fetch('https://invplus-backend.onrender.com/crear-usuario', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        })
        .then(res => res.text())
        .then(mensaje => {
            alert("Respuesta del servidor: " + mensaje);
            // Si el servidor responde con éxito, enviamos al usuario a iniciar sesión
            if(mensaje.includes("exito") || mensaje === "OK") {
                window.location.href = "iniciar_sesion.html";
            }
        })
        .catch(err => {
            console.error(err);
            alert("Error al conectar con el servidor. Intenta de nuevo.");
        });
    }
</script>

</body>
</html>
