<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Movimientos - InvPlus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url(https://images.unsplash.com/photo-1474540412665-1cdae210ae6b?fm=jpg&q=60&w=3000);
            background-size: cover;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor-historial {
            width: 90%;
            max-width: 850px;
            background: white;
            padding: 20px;
            border: 1px solid black;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .tabla-contenedor {
            border: 3px solid #1f53c5;
            padding: 5px;
            background: white;
            margin-bottom: 15px;
            overflow-x: auto;
        }

        #tabla-movimientos {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        #tabla-movimientos thead th {
            background: #1f53c5;
            color: white;
            font-size: 13px;
            padding: 8px;
            border: 1px solid black;
            font-weight: bold;
        }

        #tabla-movimientos td {
            border: 1px solid black;
            padding: 8px;
            font-size: 13px;
            color: black;
        }

        #tabla-movimientos tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .acciones-inferiores {
            text-align: left;
            margin-top: 10px;
        }

        .acciones-inferiores a {
            font-size: 13px;
            text-decoration: none;
            border: 1px solid #1f53c5;
            padding: 6px 12px;
            color: #1f53c5;
            font-weight: bold;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .acciones-inferiores a:hover {
            background: #1f53c5;
            color: white;
        }
    </style>
</head>
<body>

<div class="contenedor-historial">
    <h1>HISTORIAL DE MOVIMIENTOS</h1>

    <div class="tabla-contenedor">
        <table id="tabla-movimientos">
            <thead>
                <tr>
                    <th>Nombre Producto</th>
                    <th>Entrada</th>
                    <th>Salida</th>
                    <th>Valor Actual</th> <th>Fecha / Hora</th>
                </tr>
            </thead>
            <tbody id="cuerpo_tabla">
                <tr>
                    <td colspan="5">Cargando movimientos...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="acciones-inferiores">
        <a href="pagina-principal.html">Volver al Menú Principal</a>
    </div>
</div>

<script>
    function cargarHistorial() {
        const idUsuarioLogueado = localStorage.getItem('usuarioID');

        if (!idUsuarioLogueado) {
            alert("No hay una sesión activa. Inicia sesión nuevamente.");
            window.location.href = "iniciar_sesion.html";
            return;
        }

        fetch(`https://invplus-backend.onrender.com/obtener-historial?id_usuario=${idUsuarioLogueado}`)
            .then(respuesta => respuesta.json())
            .then(datos => {
                const cuerpo = document.getElementById("cuerpo_tabla");
                cuerpo.innerHTML = ""; 

                if (datos.length === 0) {
                    cuerpo.innerHTML = "<tr><td colspan='5'>No tienes movimientos registrados en tu cuenta.</td></tr>";
                    return;
                }

                datos.forEach(mov => {
                    const fechaTxt = new Date(mov.fecha).toLocaleString();
                    
                    const fila = document.createElement("tr");
                    fila.innerHTML = `
                        <td>${mov.nombre_producto}</td>
                        <td>${mov.entrada > 0 ? mov.entrada : '-'}</td>
                        <td>${mov.salida > 0 ? mov.salida : '-'}</td>
                        <td style="font-weight: bold; color: #1f53c5;">${mov.valor_actual}</td> <td>${fechaTxt}</td>
                    `;
                    cuerpo.appendChild(fila);
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById("cuerpo_tabla").innerHTML = 
                    "<tr><td colspan='5' style='color:red;'>Error al conectar con el servidor</td></tr>";
            });
    }

    window.onload = cargarHistorial;
</script>

</body>
</html>
