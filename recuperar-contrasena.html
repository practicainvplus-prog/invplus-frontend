<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="../css/decoracion.css">
</head>
<body>
    <section class="form-register product">
        <h4>Recuperar contraseña </h4>

        <!-- Se agrega el formulario con el método POST hacia la ruta del servidor -->
        <form action="https://invplus-backend.onrender.com/recuperar-password" method="POST">
            
            <table class="form-product">
                <tr>
                    <td>
                        E-mail: 
                    </td>
                    <td>
                        <!-- Se agrega el atributo name="correo" -->
                        <input class="controls" type="email" name="correo" id="email" placeholder="Ingrese su E-mail" required>
                    </td>             
                </tr>

                <tr>
                    <td>
                        Tipo de documento: 
                    </td>
                    <td>
                        <!-- Se agrega el atributo name="tipo_documento" y los values correspondientes -->
                        <select name="tipo_documento" required>
                            <option value="">Seleccione un tipo de identificación</option>
                            <option value="cc">Cédula de ciudadania</option>
                            <option value="ce">Cédula de extranjeria</option>
                            <option value="ti">Tarjeta de identidad</option>
                            <option value="nit">Nit</option>
                            <option value="pasaporte">Pasaporte</option>
                        </select><br>
                    </td>             
                </tr>

                <tr>
                    <td>
                        N° identificación: 
                    </td>
                    <td>
                        <!-- Se agrega el atributo name="identificacion" y cambiamos a type="number" -->
                        <input class="controls" type="number" name="identificacion" id="identificacion" placeholder="Ingrese el numero de documento" required>
                    </td>             
                </tr>
            </table>

            <br><br>
            
            <!-- El botón de submit ahora procesa el formulario -->
            <input class="button" type="submit" value="Recuperar">

        </form>

        <p style="text-align: center; margin-top: 10px;">
            <a href="iniciar_sesion.html" style="color: #1f53c5; font-size: 14px; text-decoration: none;">Volver al inicio</a>
        </p>

    </section>
</body>
</html>
